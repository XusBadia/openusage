name: iOS TestFlight

on:
  workflow_dispatch:
    inputs:
      marketing_version:
        description: Version shown in TestFlight
        required: true
        default: 0.1.0

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  upload:
    name: Archive and upload
    runs-on: macos-15
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Validate release secrets
        env:
          CERTIFICATE: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          APP_PROFILE: ${{ secrets.IOS_APP_PROFILE_BASE64 }}
          WIDGET_PROFILE: ${{ secrets.IOS_WIDGET_PROFILE_BASE64 }}
          API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8_BASE64 }}
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          for value in CERTIFICATE CERTIFICATE_PASSWORD APP_PROFILE WIDGET_PROFILE API_KEY API_KEY_ID API_ISSUER_ID; do
            test -n "${!value}" || { echo "Missing GitHub Actions secret: $value" >&2; exit 1; }
          done

      - name: Install signing assets
        env:
          CERTIFICATE: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          APP_PROFILE: ${{ secrets.IOS_APP_PROFILE_BASE64 }}
          WIDGET_PROFILE: ${{ secrets.IOS_WIDGET_PROFILE_BASE64 }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/openusage-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          echo "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/distribution.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/distribution.p12" -P "$CERTIFICATE_PASSWORD" -A -k "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          PROFILE_DIR="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"
          echo "$APP_PROFILE" | base64 --decode > "$RUNNER_TEMP/usage-companion.mobileprovision"
          echo "$WIDGET_PROFILE" | base64 --decode > "$RUNNER_TEMP/usage-companion-widgets.mobileprovision"
          for profile in "$RUNNER_TEMP/usage-companion.mobileprovision" "$RUNNER_TEMP/usage-companion-widgets.mobileprovision"; do
            decoded="$RUNNER_TEMP/$(basename "$profile").plist"
            security cms -D -i "$profile" > "$decoded"
            uuid="$(plutil -extract UUID raw -o - "$decoded")"
            cp "$profile" "$PROFILE_DIR/$uuid.mobileprovision"
          done
          cp Mobile/Config/TestFlight.xcconfig Mobile/Config/Local.xcconfig

      - name: Archive
        env:
          MARKETING_VERSION: ${{ inputs.marketing_version || '0.1.0' }}
        run: |
          DEVELOPER_DIR=/Applications/Xcode.app/Contents/Developer xcodebuild \
            -project Mobile/UsageCompanion.xcodeproj \
            -scheme UsageCompanion \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/UsageCompanion.xcarchive" \
            MARKETING_VERSION="$MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            archive

      - name: Export IPA
        run: |
          mkdir -p "$RUNNER_TEMP/export"
          DEVELOPER_DIR=/Applications/Xcode.app/Contents/Developer xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/UsageCompanion.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist Mobile/Config/ExportOptions-TestFlight.plist

      - name: Validate and upload to TestFlight
        env:
          API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8_BASE64 }}
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          mkdir -p "$RUNNER_TEMP/private_keys"
          echo "$API_KEY" | base64 --decode > "$RUNNER_TEMP/private_keys/AuthKey_${API_KEY_ID}.p8"
          export API_PRIVATE_KEYS_DIR="$RUNNER_TEMP/private_keys"
          IPA="$(find "$RUNNER_TEMP/export" -maxdepth 1 -name '*.ipa' -print -quit)"
          test -n "$IPA" || { echo "No IPA was exported" >&2; exit 1; }
          DEVELOPER_DIR=/Applications/Xcode.app/Contents/Developer xcrun altool \
            --validate-app "$IPA" --api-key "$API_KEY_ID" --api-issuer "$API_ISSUER_ID"
          DEVELOPER_DIR=/Applications/Xcode.app/Contents/Developer xcrun altool \
            --upload-app -f "$IPA" --api-key "$API_KEY_ID" --api-issuer "$API_ISSUER_ID" \
            --output-format json

      - name: Keep the exported build
        uses: actions/upload-artifact@v4
        with:
          name: OpenUsage-iOS-${{ github.run_number }}
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Clean signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/openusage-signing.keychain-db" || true
