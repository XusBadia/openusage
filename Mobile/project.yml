name: UsageCompanion

options:
  minimumXcodeGenVersion: 2.44.1
  createIntermediateGroups: true
  groupSortPosition: top
  deploymentTarget:
    iOS: "18.0"

configs:
  Debug: debug
  Release: release

configFiles:
  Debug: Config/Development.xcconfig
  Release: Config/Release.xcconfig

packages:
  OpenUsagePackage:
    path: ..

settings:
  base:
    SWIFT_VERSION: 6.0
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: true
    DEVELOPMENT_TEAM: $(MOBILE_DEVELOPMENT_TEAM)
    CODE_SIGN_STYLE: $(MOBILE_CODE_SIGN_STYLE)
    IPHONEOS_DEPLOYMENT_TARGET: 18.0

targets:
  UsageCompanion:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Resources/Assets.xcassets
        buildPhase: resources
      - path: Resources/ProviderIcons/antigravity.png
        buildPhase: resources
      - path: Resources/ProviderIcons/claude.png
        buildPhase: resources
      - path: Resources/ProviderIcons/codex.png
        buildPhase: resources
      - path: Resources/ProviderIcons/copilot.png
        buildPhase: resources
      - path: Resources/ProviderIcons/cursor.png
        buildPhase: resources
      - path: Resources/ProviderIcons/devin.png
        buildPhase: resources
      - path: Resources/ProviderIcons/grok.png
        buildPhase: resources
      - path: Resources/ProviderIcons/opencode.png
        buildPhase: resources
      - path: Resources/ProviderIcons/openrouter.png
        buildPhase: resources
      - path: Resources/ProviderIcons/zai.png
        buildPhase: resources
    dependencies:
      - package: OpenUsagePackage
        product: OpenUsageMobileCore
      - target: UsageCompanionWidgets
        embed: true
    info:
      path: Config/App-Info.plist
      properties:
        CFBundleDisplayName: $(MOBILE_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        AppGroupIdentifier: $(APP_GROUP_IDENTIFIER)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    entitlements:
      path: Config/UsageCompanion.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers:
          - $(ICLOUD_CONTAINER_IDENTIFIER)
        com.apple.developer.ubiquity-container-identifiers:
          - $(ICLOUD_CONTAINER_IDENTIFIER)
        com.apple.developer.icloud-services:
          - CloudDocuments
        com.apple.security.application-groups:
          - $(APP_GROUP_IDENTIFIER)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(MOBILE_APP_BUNDLE_ID)
        PRODUCT_NAME: UsageCompanion
        ASSETCATALOG_COMPILER_APPICON_NAME: $(MOBILE_APP_ICON_NAME)
        CODE_SIGN_IDENTITY: $(MOBILE_CODE_SIGN_IDENTITY)
        PROVISIONING_PROFILE_SPECIFIER: $(MOBILE_APP_PROVISIONING_PROFILE)
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: false
        INFOPLIST_KEY_CFBundleDisplayName: $(MOBILE_DISPLAY_NAME)

  UsageCompanionWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: Resources/ProviderIcons/antigravity.png
        buildPhase: resources
      - path: Resources/ProviderIcons/claude.png
        buildPhase: resources
      - path: Resources/ProviderIcons/codex.png
        buildPhase: resources
      - path: Resources/ProviderIcons/copilot.png
        buildPhase: resources
      - path: Resources/ProviderIcons/cursor.png
        buildPhase: resources
      - path: Resources/ProviderIcons/devin.png
        buildPhase: resources
      - path: Resources/ProviderIcons/grok.png
        buildPhase: resources
      - path: Resources/ProviderIcons/opencode.png
        buildPhase: resources
      - path: Resources/ProviderIcons/openrouter.png
        buildPhase: resources
      - path: Resources/ProviderIcons/zai.png
        buildPhase: resources
    dependencies:
      - package: OpenUsagePackage
        product: OpenUsageMobileCore
    info:
      path: Config/Widget-Info.plist
      properties:
        CFBundleDisplayName: $(MOBILE_DISPLAY_NAME) Widgets
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        AppGroupIdentifier: $(APP_GROUP_IDENTIFIER)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Config/UsageCompanionWidgets.entitlements
      properties:
        # The extension reads the synced iCloud folder itself on every timeline refresh, so it needs the
        # container too — with only the App Group it can never do more than re-render the app's cache.
        com.apple.developer.icloud-container-identifiers:
          - $(ICLOUD_CONTAINER_IDENTIFIER)
        com.apple.developer.ubiquity-container-identifiers:
          - $(ICLOUD_CONTAINER_IDENTIFIER)
        com.apple.developer.icloud-services:
          - CloudDocuments
        com.apple.security.application-groups:
          - $(APP_GROUP_IDENTIFIER)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(MOBILE_WIDGET_BUNDLE_ID)
        PRODUCT_NAME: UsageCompanionWidgets
        CODE_SIGN_IDENTITY: $(MOBILE_CODE_SIGN_IDENTITY)
        PROVISIONING_PROFILE_SPECIFIER: $(MOBILE_WIDGET_PROVISIONING_PROFILE)
        SKIP_INSTALL: true
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_CFBundleDisplayName: $(MOBILE_DISPLAY_NAME) Widgets

  UsageCompanionTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: UsageCompanion
      - package: OpenUsagePackage
        product: OpenUsageMobileCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(MOBILE_APP_BUNDLE_ID).tests
        GENERATE_INFOPLIST_FILE: true

schemes:
  UsageCompanion:
    build:
      targets:
        UsageCompanion: all
        UsageCompanionWidgets: all
        UsageCompanionTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - UsageCompanionTests
    archive:
      config: Release
